# MindButler 单机 nginx 配置（Linux）
# 放到 /etc/nginx/conf.d/mindbutler.conf，改 server_name 后 nginx -t && nginx -s reload
#
# 目录约定：/opt/mindbutler/dist（前端产物）、/opt/mindbutler/app.jar（后端，监听 8080）

server {
    listen 80;
    server_name _;                       # 有域名就填域名，没有就用 IP 访问

    root /opt/mindbutler/dist;
    index index.html;
    charset utf-8;

    # 首屏 JS/CSS 体积大，手机上不压缩会明显卡顿（nginx 默认只压 text/html）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端反代：/api/chat/ask-stream -> http://127.0.0.1:8080/chat/ask-stream
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # ---- SSE 三件套：删掉任何一个，打字机效果就没了 ----
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Accept-Encoding identity;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 2m;
    }
}
