spring.application.name=aichat
server.port=8080

# 默认激活 local profile；application-local.properties 不提交到 Git
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==================== Ollama（本地模型） ====================
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5-coder:7b}
spring.ai.ollama.chat.options.temperature=0.7

# ==================== DeepSeek（走 OpenAI 兼容协议，key 放环境变量不提交） ====================
# DeepSeek API 与 OpenAI 完全兼容，用 OpenAI starter 配 DeepSeek 的 endpoint + key
spring.ai.openai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:sk-deepseek-placeholder}
spring.ai.openai.chat.options.model=deepseek-chat

# ==================== Redis ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:16379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ==================== MySQL ====================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:13306/aichat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis ====================
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.map-underscore-to-camel-case=true

# ==================== 应用配置 ====================
# 本地开发 true：验证码完整打印到 [DEV] 日志，仅限本地，不要在生产开启
# 生产默认 false：当前未接入真实短信供应商，/user/code 会返回 503，不会假成功
# 以后接阿里云/腾讯云时，新增 SmsSender 实现并替换 SmsConfig 的 Bean
app.sms.dev-mode=${APP_SMS_DEV_MODE:false}

# ==================== 聊天上下文 ====================
# 只把最近 N 条历史消息送给模型，控制 Prompt 长度；<=0 表示不裁剪
app.chat.context-max-messages=${APP_CHAT_CONTEXT_MAX_MESSAGES:20}
app.chat.context-max-chars=${APP_CHAT_CONTEXT_MAX_CHARS:24000}
# 每用户每日对话次数上限；0 表示不限（默认）。线上建议配 50 之类，防单账号刷爆模型额度
app.chat.daily-limit=${APP_CHAT_DAILY_LIMIT:0}

# ==================== 多模型路由 ====================
# 白名单 + 默认模型 + 哪些走 Ollama（本地），其余走 OpenAI 兼容协议（DeepSeek）
app.models.available=${APP_MODELS_AVAILABLE:qwen2.5-coder:7b,deepseek-chat}
app.models.default-model=${APP_MODELS_DEFAULT:qwen2.5-coder:7b}
app.models.ollama-models=${APP_MODELS_OLLAMA:qwen2.5-coder:7b}

# ==================== MindButler P1：长期记忆 + 口语化任务 ====================
# 总开关；关闭后只保留手动 CRUD，不做意图提取/注入（M3 才接）
app.mindbutler.enabled=${APP_MINDBUTLER_ENABLED:true}
# dynamic 记忆默认有效期（天）；stable 记忆不过期
app.mindbutler.memory.dynamic-ttl-days=${APP_MINDBUTLER_MEMORY_DYN_TTL_DAYS:90}
# 每用户 active 记忆上限
app.mindbutler.memory.max-per-user=${APP_MINDBUTLER_MEMORY_MAX_PER_USER:100}
# 注入画像配额（stable/dynamic 各取多少条 + 总字符预算）
app.mindbutler.memory.inject-max-stable=${APP_MINDBUTLER_INJECT_MAX_STABLE:5}
app.mindbutler.memory.inject-max-dynamic=${APP_MINDBUTLER_INJECT_MAX_DYNAMIC:5}
app.mindbutler.memory.inject-max-chars=${APP_MINDBUTLER_INJECT_MAX_CHARS:1200}
# P1 固定时区（启动时校验只允许 Asia/Shanghai）
app.mindbutler.task.zone=${APP_MINDBUTLER_TASK_ZONE:Asia/Shanghai}
# M2：任务上限 / 到期查询条数上限 / pending 有效期 + payload 上限
app.mindbutler.task.max-per-user=${APP_MINDBUTLER_TASK_MAX_PER_USER:500}
app.mindbutler.task.due-limit=${APP_MINDBUTLER_TASK_DUE_LIMIT:50}
app.mindbutler.pending.ttl-minutes=${APP_MINDBUTLER_PENDING_TTL_MINUTES:10}
app.mindbutler.pending.payload-max-bytes=${APP_MINDBUTLER_PENDING_PAYLOAD_MAX_BYTES:16384}
# M3：意图提取开关（关闭后聊天不拦截；总开关 app.mindbutler.enabled 关闭则连手动注入也停）
app.mindbutler.intent.enabled=${APP_MINDBUTLER_INTENT_ENABLED:true}
# M3：意图提取器模型（需在 app.models.available 白名单内；deepseek-chat 结构化能力更强）
app.mindbutler.intent.extract-model=${APP_MINDBUTLER_INTENT_EXTRACT_MODEL:deepseek-chat}
# M3：提取超时（毫秒，<=0 不限）+ 每用户每日提取次数（0=不限）
app.mindbutler.intent.timeout-ms=${APP_MINDBUTLER_INTENT_TIMEOUT_MS:5000}
app.mindbutler.intent.daily-limit=${APP_MINDBUTLER_INTENT_DAILY_LIMIT:50}
# M3：单条消息最多候选数（超出截断）
app.mindbutler.intent.max-memories=${APP_MINDBUTLER_INTENT_MAX_MEMORIES:5}
app.mindbutler.intent.max-tasks=${APP_MINDBUTLER_INTENT_MAX_TASKS:5}
# M4：评测 runner 是否真跑 LLM（false=桩模式 100% 确定性；true 需配真实 key，CI 可置 false）
app.mindbutler.eval.real-model=${APP_MINDBUTLER_EVAL_REAL_MODEL:false}

# ==================== Swagger / OpenAPI 在线接口文档 ====================
# 默认开启；生产环境可用 SPRINGDOC_ENABLED=false 关掉（/swagger-ui.html + /v3/api-docs 都不暴露）
springdoc.enabled=${SPRINGDOC_ENABLED:true}
# 给文档加个元信息（标题/版本），Swagger UI 顶部会显示
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# 跨域白名单，逗号分隔，支持 * 通配；上线改成真实域名，如 https://chat.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ---- MCP：让模型能查外部信息（时间/天气/网页）----
# 总开关；关掉后不启动任何子进程，模型也不会挂工具
app.mcp.enabled=${APP_MCP_ENABLED:true}
# 单次工具调用超时（毫秒）
app.mcp.timeout-ms=${APP_MCP_TIMEOUT_MS:15000}
# 只有这些模型会挂工具：本地 7B 模型的模板只会把调用打成文本，走不通
app.mcp.tool-models=${APP_MCP_TOOL_MODELS:deepseek-chat}
# 内置信息查询服务端（stdio，用 node 跑仓库里的脚本）
app.mcp.servers.info.command=${APP_MCP_COMMAND:node}
app.mcp.servers.info.args[0]=mcp-servers/info-server.mjs
app.mcp.servers.info.enabled=true
